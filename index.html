<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIGC · 维护中</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0d0d0f;
      color: #f5f3ee;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .wrap { text-align: center; max-width: 420px; }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 18px;
      font-size: 30px; font-weight: 800; color: #fff;
      background: linear-gradient(135deg, #ff5f3c 0%, #ff9a3c 100%);
      box-shadow: 0 12px 32px rgba(255, 95, 60, 0.35);
    }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: 0; margin-bottom: 12px; }
    p { font-size: 15px; line-height: 1.7; color: #9b9a94; }
    .dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #ff7a3c; margin-right: 8px; vertical-align: 1px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">A</div>
    <h1>AIGC</h1>
    <p><span class="dot"></span>站点维护中，视频暂时停播</p>
    <p style="margin-top:10px; font-size:13px; color:#6f6e68;">作品与数据已安全保留，恢复后将自动开放</p>
  </div>
</body>
</html>
