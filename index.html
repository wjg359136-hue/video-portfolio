<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品集</title>
  <meta name="description" content="视频作品集，随时随地在不同设备打开查看">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="site-title" id="site-title">作品集</h1>
      <p class="site-subtitle" id="site-subtitle">视频作品展示</p>
    </div>
  </header>

  <nav class="filter-bar" id="filter-bar" aria-label="项目筛选"></nav>

  <main class="container" id="app">
    <p class="loading" id="loading">加载中…</p>
    <p class="error" id="error" hidden>数据加载失败，请稍后刷新重试。</p>
  </main>

  <footer class="site-footer">
    <div class="container">作品集 · 随时随地在不同设备打开</div>
  </footer>

  <div class="modal" id="video-modal" hidden>
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-label="视频播放">
      <button class="modal-close" id="modal-close" aria-label="关闭" type="button">&times;</button>
      <h2 class="modal-title" id="modal-title"></h2>
      <div class="modal-video-wrap">
        <video id="modal-video" controls playsinline preload="metadata"></video>
        <p class="modal-error" id="modal-error" hidden>视频加载失败，请检查链接或稍后重试。</p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
